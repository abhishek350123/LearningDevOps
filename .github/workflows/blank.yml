# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    
    # FIX: This grants the workflow the necessary permissions to write/push files to your repository
    permissions:
      contents: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
          
      # EXAMPLE: How to successfully update a file and push it without the integration error
      - name: Update azure-pipelines-1.yml and push back to main
        run: |
          # 1. Set up the automated Git bot identity
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 2. Make your file changes (this just adds a comment as a test)
          echo "# Updated automatically by GitHub Actions" >> azure-pipelines-1.yml
          
          # 3. Add, commit, and push the file to the main branch
          git add azure-pipelines-1.yml
          git commit -m "Automated update to azure-pipelines-1.yml"
          git push
